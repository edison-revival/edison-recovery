name: test

on:
  push:
    branches: [main]
    paths-ignore: # documentation-only changes don't need a build
      - "**.md"
      - "docs/**"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0 # immutable release
        with:
          enable-cache: false # no dependencies to cache; avoids save races between jobs
      - name: Unit tests
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0 # immutable release
        with:
          enable-cache: false # no dependencies to cache; avoids save races between jobs
      - run: uvx ruff@0.14.0 format --check .
      - run: uvx ruff@0.14.0 check .

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck scripts/*.sh
